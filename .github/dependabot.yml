# Keeps the SHA-pinned GitHub Actions in .github/workflows current.
# One grouped pull request a month; npm dependencies are not covered here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
