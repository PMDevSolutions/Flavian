name: Init Wizard Tests

on:
  push:
    paths:
      - 'scripts/init.mjs'
      - 'scripts/init/**'
      - 'scripts/canva-fse/**'
      - 'tests/init/**'
      - 'tests/fixtures/canva/**'
      - '.claude/templates/theme/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/init-wizard.yml'
  pull_request:
    paths:
      - 'scripts/init.mjs'
      - 'scripts/init/**'
      - 'scripts/canva-fse/**'
      - 'tests/init/**'
      - 'tests/fixtures/canva/**'
      - '.claude/templates/theme/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/init-wizard.yml'

jobs:
  init-wizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm via Corepack — pnpm/action-setup isn't on the allowed-actions list.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the test:init script uses `node --test "<glob>"`, and
          # test-runner glob support landed in Node 21. (The init wizard has no
          # Node-20 floor — only the pipeline package pins to 20.)
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run init wizard tests
        run: pnpm run test:init
