name: PHPCS

# Enforces the WordPress Coding Standards on every pull request to main.
# The standard, scan targets and exclusions live in ./phpcs.xml.dist; the same
# check runs locally via `composer phpcs` or
# `./scripts/wordpress/check-coding-standards.sh --strict`.
#
# No `paths:` filter on purpose: a path-filtered required check shows as pending
# (and blocks merges) on PRs that don't touch its paths. The job is cheap and
# passes trivially when no first-party PHP changed, so it is safe to require.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify WordPress standards are registered
        run: ./vendor/bin/phpcs -i

      - name: Run WordPress Coding Standards (PHPCS)
        shell: bash
        # --strict makes the script exit non-zero on any violation; -q
        # suppresses PHPCS progress so the checkstyle report on stdout stays
        # clean for cs2pr, which turns it into inline PR annotations.
        # `shell: bash` runs with -eo pipefail, so either the script or cs2pr
        # failing fails the job.
        run: ./scripts/wordpress/check-coding-standards.sh --strict -q --report=checkstyle | cs2pr
