name: Pipeline Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.filter.outputs.scripts || steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scripts:
              - 'scripts/figma-fse/**'
            tests:
              - 'tests/**'

  test:
    needs: check-paths
    if: needs.check-paths.outputs.should-test == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Make scripts executable
        run: chmod +x scripts/figma-fse/*.sh

      - name: Run Figma-to-FSE pipeline tests
        run: ./tests/libs/bats-core/bin/bats tests/figma-fse/

  test-status:
    runs-on: ubuntu-latest
    needs: [check-paths, test]
    if: always()
    name: Pipeline Tests Status
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.check-paths.outputs.should-test }}" != "true" ]; then
            echo "No pipeline/test changes detected — skipping tests"
            exit 0
          fi
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "Pipeline tests passed"
            exit 0
          fi
          echo "Pipeline tests failed"
          exit 1
