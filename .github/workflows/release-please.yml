name: release-please

# release-please opens the release PR and, when it merges, tags the commit and
# creates the GitHub Release as a DRAFT (`draft` and `force-tag-creation` in
# release-please-config.json). The installers job then calls gui-release.yml in the
# same run, which builds the desktop GUI installers, attaches them to the draft and
# publishes it (issue #189). Two reasons for this shape: the Release is created with
# GITHUB_TOKEN, and GitHub never fires `on: release` for an event that token created;
# and this repository's releases are immutable once published, so the installers have
# to be attached before publication.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  installers:
    name: Build and attach GUI installers
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/gui-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
