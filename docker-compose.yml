services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
      cache_from:
        - flavian-wordpress:latest
      args:
        - WP_CLI_VERSION=2.10.0
    image: flavian-wordpress:latest
    container_name: flavian-wp
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    volumes:
      # Mount your themes directory to WordPress wp-content/themes
      - ./themes:/var/www/html/wp-content/themes
      # Mount plugins directory
      - ./plugins:/var/www/html/wp-content/plugins
      # Mount mu-plugins directory
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      # Persist WordPress files (core, uploads, etc.)
      - wordpress_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.0
    container_name: flavian-db
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot WooCommerce installer.
  #
  # Run with the 'woocommerce' compose profile to bootstrap a fresh store
  # with the cart/checkout/my-account pages and (optionally) sample products:
  #
  #   docker compose --profile woocommerce up woocommerce-installer
  #
  # The container exits as soon as the install script completes. Re-running it
  # is safe — every step is idempotent.
  woocommerce-installer:
    image: docker:cli
    container_name: flavian-wc-installer
    profiles: ["woocommerce"]
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/wordpress-install:/scripts:ro
    working_dir: /scripts
    environment:
      WC_INSTALL_SAMPLE_DATA: ${WC_INSTALL_SAMPLE_DATA:-true}
      WC_DEFAULT_THEME:        ${WC_DEFAULT_THEME:-flavian-shop}
      WC_DEFAULT_CURRENCY:     ${WC_DEFAULT_CURRENCY:-USD}
      WC_DEFAULT_COUNTRY:      ${WC_DEFAULT_COUNTRY:-US:CA}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache bash docker-cli-compose >/dev/null
        ARGS=""
        [ "$$WC_INSTALL_SAMPLE_DATA" = "false" ] && ARGS="$$ARGS --no-sample"
        [ -n "$$WC_DEFAULT_THEME"    ] && ARGS="$$ARGS --theme $$WC_DEFAULT_THEME"
        [ -n "$$WC_DEFAULT_CURRENCY" ] && ARGS="$$ARGS --currency $$WC_DEFAULT_CURRENCY"
        [ -n "$$WC_DEFAULT_COUNTRY"  ] && ARGS="$$ARGS --country $$WC_DEFAULT_COUNTRY"
        bash /scripts/setup-woocommerce.sh $$ARGS

  # One-shot headless WordPress installer.
  #
  # Run with the 'headless' compose profile to install WPGraphQL, configure
  # CORS + preview routing, and print the env values your frontend needs:
  #
  #   docker compose --profile headless up headless-installer
  #
  # The container exits when setup-headless.sh completes. Re-running is safe —
  # every step is idempotent.
  headless-installer:
    image: docker:cli
    container_name: flavian-headless-installer
    profiles: ["headless"]
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/wordpress-install:/scripts:ro
    working_dir: /scripts
    environment:
      HEADLESS_FRONTEND_URL: ${HEADLESS_FRONTEND_URL:-http://localhost:3000}
      HEADLESS_INSTALL_JWT:  ${HEADLESS_INSTALL_JWT:-true}
      HEADLESS_INSTALL_BLOCKS: ${HEADLESS_INSTALL_BLOCKS:-true}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache bash docker-cli-compose >/dev/null
        ARGS="--frontend-url $$HEADLESS_FRONTEND_URL"
        [ "$$HEADLESS_INSTALL_JWT"    = "false" ] && ARGS="$$ARGS --no-jwt"
        [ "$$HEADLESS_INSTALL_BLOCKS" = "false" ] && ARGS="$$ARGS --no-blocks"
        bash /scripts/setup-headless.sh $$ARGS

  # One-shot multisite installer.
  #
  # Converts the install into a subdirectory multisite network and creates
  # a sample sub-site so the network admin has something to look at:
  #
  #   docker compose --profile multisite up multisite-installer
  #
  # Re-running is safe — every step is idempotent.
  multisite-installer:
    image: docker:cli
    container_name: flavian-multisite-installer
    profiles: ["multisite"]
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/wordpress-install:/scripts:ro
    working_dir: /scripts
    environment:
      MS_NETWORK_TITLE:      ${MS_NETWORK_TITLE:-Flavian Network}
      MS_SECOND_SITE_SLUG:   ${MS_SECOND_SITE_SLUG:-site2}
      MS_SECOND_SITE_TITLE:  ${MS_SECOND_SITE_TITLE:-Site Two}
      MS_CREATE_SECOND_SITE: ${MS_CREATE_SECOND_SITE:-true}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache bash docker-cli-compose >/dev/null
        ARGS="--network-title \"$$MS_NETWORK_TITLE\" --second-site-slug $$MS_SECOND_SITE_SLUG --second-site-title \"$$MS_SECOND_SITE_TITLE\""
        [ "$$MS_CREATE_SECOND_SITE" = "false" ] && ARGS="--network-title \"$$MS_NETWORK_TITLE\" --no-second-site"
        eval bash /scripts/setup-multisite.sh $$ARGS

  # Optional: phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: flavian-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  wordpress_data:
  db_data:
