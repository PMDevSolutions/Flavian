# Packaging config. Build installers locally with:
#   pnpm --filter @flavian/gui package      (electron-vite build && electron-builder)
#
# The GUI operates on a Flavian project directory on disk — it locates the repo
# markers (or, in a future iteration, you point it at a folder) and writes themes,
# .env, and conversion output there. So the app bundle ships only the GUI itself;
# it deliberately does NOT embed the template or its scripts (those live in, and
# must stay writable in, the user's project).
appId: net.pmds.flavian.gui
productName: Flavian
directories:
  output: dist
  buildResources: build
files:
  - out/**
asar: true
win:
  target: nsis
  # Unsigned local builds: skip the code-sign + exe-edit step so electron-builder
  # doesn't fetch the winCodeSign toolchain (whose archive holds macOS symlinks that
  # can't be extracted on Windows without Developer Mode / an elevated shell).
  signAndEditExecutable: false
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
  # electron-builder 26.8+ refuses the default Linux binary name, which it derives from the
  # package name ("@flavian/gui" becomes "@flaviangui", and "@" fails its AppImage path check).
  # Set it here, under linux:, so macOS and Windows keep productName (Flavian.app, Flavian.exe).
  executableName: flavian
  category: Development
appImage:
  # electron-builder adds --no-sandbox to the AppImage launcher by default (an AppImage cannot ship a
  # SUID chrome-sandbox) and drops that default once executableArgs is set, so keep it here.
  # --ozone-platform=x11: Electron 42 segfaults at its first window on Wayland desktops (Ubuntu 26.04)
  # unless Ozone is pinned to X11, and the pin only works as a real command-line argument
  # (issue #190; the dev runner and the smoke test pass the same switch, see scripts/launch-flags.mjs).
  executableArgs: ["--no-sandbox", "--ozone-platform=x11"]
