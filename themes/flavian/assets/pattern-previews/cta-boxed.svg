<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#fafafa"/>
  <!-- Centered box -->
  <rect x="200" y="40" width="800" height="280" rx="12" fill="#1a3f6f"/>
  <!-- Heading -->
  <rect x="400" y="80" width="400" height="26" rx="4" fill="#ffffff"/>
  <!-- Subtitle lines -->
  <rect x="380" y="125" width="440" height="12" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="410" y="147" width="380" height="12" rx="3" fill="rgba(255,255,255,0.5)"/>
  <!-- Two buttons side by side -->
  <rect x="370" y="195" width="200" height="48" rx="6" fill="#e8491d"/>
  <rect x="410" y="212" width="120" height="14" rx="3" fill="#ffffff"/>
  <rect x="630" y="195" width="200" height="48" rx="6" fill="transparent" stroke="#ffffff" stroke-width="2"/>
  <rect x="670" y="212" width="120" height="14" rx="3" fill="#ffffff"/>
  <!-- Label -->
  <rect x="0" y="360" width="1200" height="40" fill="#1d1d1f"/>
  <text x="600" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff">CTA Boxed</text>
</svg>