  <!-- Column 2: Text -->
  <rect x="640" y="120" width="360" height="22" rx="4" fill="#1d1d1f"/>
  <rect x="640" y="158" width="480" height="10" rx="2" fill="#6b7280"/>
  <rect x="640" y="178" width="450" height="10" rx="2" fill="#6b7280"/>
  <rect x="640" y="198" width="420" height="10" rx="2" fill="#6b7280"/>
  <rect x="640" y="218" width="460" height="10" rx="2" fill="#6b7280"/>
  <!-- Button -->
  <rect x="640" y="260" width="150" height="40" rx="6" fill="#e8491d"/>
