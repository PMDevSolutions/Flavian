  <rect x="350" y="135" width="500" height="14" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="400" y="160" width="400" height="14" rx="3" fill="rgba(255,255,255,0.5)"/>
  <!-- CTA Button -->
