  <rect x="0" y="360" width="1200" height="40" fill="rgba(0,0,0,0.3)"/>
  <text x="600" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff">Newsletter Signup</text>
</svg>