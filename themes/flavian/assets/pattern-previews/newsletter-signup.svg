<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#1a3f6f"/>
  <!-- Centered heading -->
  <rect x="380" y="90" width="440" height="26" rx="4" fill="#ffffff"/>
  <!-- Subtitle -->
  <rect x="350" y="138" width="500" height="12" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="400" y="160" width="400" height="12" rx="3" fill="rgba(255,255,255,0.5)"/>
  <!-- Email input + button row -->
  <rect x="300" y="205" width="400" height="48" rx="6" fill="#ffffff"/>
  <rect x="320" y="222" width="180" height="14" rx="3" fill="#6b7280" opacity="0.4"/>
  <rect x="710" y="205" width="190" height="48" rx="6" fill="#e8491d"/>
  <rect x="755" y="222" width="100" height="14" rx="3" fill="#ffffff"/>
  <!-- Privacy note -->
  <rect x="420" y="275" width="360" height="10" rx="2" fill="rgba(255,255,255,0.3)"/>
